[package]
name = "onhold-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "time"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs"] }

reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "rustls"] }
uuid = { version = "1.27", features = ["v4"] }
sha3 = "0.10.9"
k256 = { version = "0.13.4", features = ["ecdsa"] }

tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.32", features = ["sink"] }

tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
tokio-postgres-rustls = { version = "0.14.0", features = ["aws-lc-rs", "webpki-roots"] }
redis = { version = "1.7.1", default-features = false, features = ["tokio-rustls-comp", "connection-manager", "tls-rustls-webpki-roots"] }

deadpool-postgres = "0.14"

base64 = "0.22"
png = "0.17.16"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
